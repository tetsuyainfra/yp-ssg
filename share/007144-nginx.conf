user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;


events {
    worker_connections 1024;
}



http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format  vhost  '$host:$server_port - $remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format jsonl escape=json '{"timestamp":"$time_iso8601",'
                             '"elapsed_time":"$request_time",'
                             '"user_name":"$remote_user",'
                             '"status":"$status",'
                             '"response_size":"$body_bytes_sent",'
                             '"network":{'
                                '"host":"$host",'
                                '"server_name":"$server_name",'
                                '"http_x_forwarded_for":"$http_x_forwarded_for",'
                                '"remote_ip":"$remote_addr",'
                                '"remote_port":"$remote_port",'
                                '"local_ip":"$server_addr",'
                                '"local_port":"$server_port",'
                                '"connection_status":"-"},'
                             '"request":{'
                                '"request":"$request",'
                                '"method":"$request_method",'
                                '"url":"$uri",'
                                '"query_string":"$query_string",'
                                '"protocol":"$server_protocol",'
                                '"referer":"$http_referer"},'
                             '"user_agent":{'
                             '"UserAgent":"$http_user_agent",'
                             '"CH_UA":"$http_sec_ch_ua",'
                             '"CH-UA-Mobile":"$http_sec_ch_ua_mobile",'
                             '"CH-UA-Bitness":"$http_sec_ch_ua_bitness",'
                             '"CH-UA-Form-Factors":"$http_sec_ch_ua_form_factors",'
                             '"CH-UA-Full-Version-List":"$http_sec_ch_ua_full_version_list",'
                             '"CH-UA-WoW64":"$http_sec_ch_ua_wow64",'
                             '"CH_Version":"$http_sec_ch_ua_full_version",'
                             '"CH_Platform":"$http_sec_ch_ua_platform",'
                             '"CH_Platform-Version":"$http_sec_ch_ua_platform_version",'
                             '"CH_Arch":"$http_sec_ch_ua_arch",'
                             '"CH_Model":"$http_sec_ch_ua_model"},'
                             '"ssl":{'
                                 '"https":"$https",'
                                 '"ssl_protocol":"$ssl_protocol",'
                                 '"ssl_cipher":"$ssl_cipher",'
                                 '"quic_version":null'
                             '}'
                        '}';

    # access_log /var/log/nginx/access.log main;
    # access_log /var/log/nginx/access.log vhost;
    # access_log /dev/stdout vhost;
    access_log  /var/log/nginx/access.json  jsonl;

    sendfile on;
    #tcp_nopush     on;

    keepalive_timeout 65;

    #gzip  on;

    upstream backend-yp {
        resolver 127.0.0.11 valid=30s; # docker
        server yp:7143;
    }

    upstream backend-yp-beta {
        resolver 127.0.0.11 valid=30s;
        server yp-beta:7143;
    }

    # default
    # server {
    #     listen       80  default_server;
    #     server_name  _;
    #     return       404;
    # }

    # yp.007144.xyz
    server {
        listen 80;
        # listen [::]:80;
        server_name yp.007144.xyz default_server;
        charset UTF-8;

        access_log /var/log/nginx/yp.access.log vhost;

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location /index.txt {
            proxy_pass http://backend-yp/index.txt;

            # # 名前解決できないと落ちるのでダミー値で一旦起動させる
            # resolver 127.0.0.11 valid=30s; # docker
            # set $dummy_var http://yp:7143/index.txt;
            # proxy_pass $dummy_var;
        }

        location /api/index.json {
            proxy_pass http://backend-yp/api/index.json;

            # resolver 127.0.0.11 valid=30s; # docker
            # set $dummy_var http://yp:7143/api/index.json;
            # proxy_pass $dummy_var;
        }

        location / {
            root /usr/share/nginx/yp;
            index index.html index.htm;
        }
    }

    # yp-beta.007144.xyz
    server {
        listen 80;
        # listen [::]:80;
        server_name yp-beta.007144.xyz;
        charset UTF-8;

        access_log /var/log/nginx/yp-beta.access.log vhost;

        #error_page  404              /404.html;
        # redirect server error pages to the static page /50x.html
        #
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location /index.txt {
            proxy_pass http://backend-yp-beta/api/index.json;
            # resolver 127.0.0.11 valid=30s; # docker
            # set $dummy_var http://yp-beta:17143/index.txt;
            # proxy_pass $dummy_var;
        }

        location /api/index.json {
            proxy_pass http://backend-yp-beta/api/index.json;
            # resolver 127.0.0.11 valid=30s; # docker
            # set $dummy_var http://yp-beta:17143/api/index.json;
            # proxy_pass $dummy_var;
        }

        location / {
            root /usr/share/nginx/yp-beta;
            index index.html index.htm;
        }
    }

}
