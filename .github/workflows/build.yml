name: CI build

on:
  push:
    branches:
      #   - "main"
      - "develop"
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      node-version: 22.x

    steps:
      - uses: actions/checkout@v4

      # - name: Use Node.js ${{ env.node-version }}
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: ${{ env.node-version }}
      #     cache: "npm"
      # - run: npm ci
      # - run: npm test
      # - name: Get CONFIG NAME
      #   id: split_name
      #   run: |
      #     field1=$(echo "${{ matrix.env_file }}" | cut -d'.' -f1)
      #     echo "SPLIT_NAME=${field1}" >> $GITHUB_OUTPUT

      # - name: Build sites by configs
      #   run: |
      #     ITEMS=$(echo '${{ env.env_file_list }}' | jq -r '.[]')
      #     for item in $ITEMS; do
      #       echo process... $item
      #       npm exec -c "env-cmd -f $item npm run build"
      #     done

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            tetsuyainfra/yp-ssg
          tags: |
            type=ref,event=branch

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: "./docker/Dockerfile"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  notify:
    # 依存するjob
    needs: build
    # needsの結果によらず必ず実行する
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # - uses: actions/checkout@v2
      # Discordへの通知
      ## 成功した場合
      - name: Notify success to Discord
        if: ${{ success() }}
        env:
          ACTION_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: >-
          curl -H "Content-Type: application/json"
          -X POST
          -d '{
            "content": "[${{ github.repository }}]ビルドが完了しました！ ${{ env.ACTION_URL }}"
          }'
          ${{ secrets.DISCORD_WEBHOOK_URL }}
      ## 失敗した場合
      - name: Notify failed to Discord
        if: ${{ success() }}
        env:
          ACTION_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: >-
          curl -H "Content-Type: application/json"
          -X POST
          -d '{
            "content": "[${{ github.repository }}]ビルドが失敗しました！ ${{ env.ACTION_URL }}"
          }'
          ${{ secrets.DISCORD_WEBHOOK_URL }}